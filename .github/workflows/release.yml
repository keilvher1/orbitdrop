# OrbitDrop release — DRAFTS ONLY (docs/RELEASING.md).
#
# A pushed tag vX.Y.Z (or a manual run naming an existing tag) builds the packages and adds them to
# the tag's draft GitHub release, which a human checks and publishes. Nothing here ever publishes a
# release, and a release that is already published is never changed.
#
#   plan     — the tag matches apps/desktop/package.json; decides whether CI builds macOS packages.
#   macos    — only when Developer ID signing AND notarization secrets exist: arm64 + x64, signed,
#              notarized and stapled (apps and DMGs; --require-signing --require-notarization).
#              Without those secrets it is skipped: macOS release packages are then built on the
#              owner's Mac with `node scripts/release-mac.mjs <tag>`, which keeps the Developer ID
#              key off GitHub. Unsigned macOS packages never go to a release.
#   windows  — x64 NSIS installer. Signed through SignPath Foundation when SignPath is configured (below)
#              and the run builds a tag: OrbitDrop.exe, OrbitDropHelper.exe and the uninstaller in a first
#              signing request, the installer in a second one, each approved by a person in SignPath
#              (docs/packaging.md §5, docs/RELEASING.md). Otherwise as before: Authenticode-signed when
#              WIN_CSC_LINK exists, else unsigned and labelled "-unsigned" (both are valid update targets:
#              latest.yml names the real file).
#   release  — the only job that can write: creates or updates the tag's draft release
#              (scripts/release-assets.mjs: gh release create --draft / gh release upload --clobber),
#              uploads the packages, latest-mac.yml / latest.yml, blockmaps and build reports, and
#              rewrites SHA256SUMS.txt over every asset of the release.
#
# A manual run without a tag only builds (workflow artifacts, no release). With "signpath_rehearsal" it
# also rehearses the SignPath flow with a self-signed stand-in instead of SignPath (Windows only, artifacts
# labelled "-rehearsal", never released).
#
# Secrets (all optional; signing secrets reach only the steps that sign):
#   macOS signing:       MAC_CSC_LINK (base64 .p12 "Developer ID Application" or an https URL),
#                        MAC_CSC_KEY_PASSWORD
#   macOS notarization:  APPLE_API_KEY_P8 (contents of AuthKey_<key id>.p8), APPLE_API_KEY_ID,
#                        APPLE_API_ISSUER   — or — APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows signing:     WIN_CSC_LINK (base64 .pfx or https URL), WIN_CSC_KEY_PASSWORD
#   SignPath:            secret SIGNPATH_API_TOKEN and the repository variables SIGNPATH_ORGANIZATION_ID,
#                        SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG (all four, or SignPath is off);
#                        artifact configurations "windows-binaries" and "windows-installer"
#                        (apps/desktop/build/signpath/). SignPath verifies the build origin from this run, so a
#                        signed build must run on the tag itself (a push of the tag, or Run workflow on the tag).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (vX.Y.Z) to build and add to its draft release. Empty = build only (workflow artifacts, no release).
        type: string
        default: ''
      signpath_rehearsal:
        description: Build only (tag empty), Windows only, rehearsing the SignPath flow with a self-signed stand-in (never released).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      version: ${{ steps.win.outputs.version }}
      mac: ${{ steps.mac.outputs.build }}
      # classic (WIN_CSC_LINK or unsigned, as before) | signpath | rehearsal
      win_signing: ${{ steps.win.outputs.signing }}
    steps:
      - name: Release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then tag="$PUSHED_TAG"; else tag="$INPUT_TAG"; fi
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$tag\" is not a release tag (vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"; else echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - name: Tag matches the app version
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi
      # Secrets are not available to `if:` expressions: decide here, in the shell.
      - name: How are the Windows packages signed?
        id: win
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_REF: ${{ github.ref }}
          REHEARSAL: ${{ inputs.signpath_rehearsal == true }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          set -euo pipefail
          echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          missing=""
          [ -n "$SIGNPATH_API_TOKEN" ] || missing="$missing secret SIGNPATH_API_TOKEN"
          [ -n "$SIGNPATH_ORGANIZATION_ID" ] || missing="$missing variable SIGNPATH_ORGANIZATION_ID"
          [ -n "$SIGNPATH_PROJECT_SLUG" ] || missing="$missing variable SIGNPATH_PROJECT_SLUG"
          [ -n "$SIGNPATH_SIGNING_POLICY_SLUG" ] || missing="$missing variable SIGNPATH_SIGNING_POLICY_SLUG"
          if [ "$REHEARSAL" = true ]; then
            if [ -n "$TAG" ]; then
              echo "::error::signpath_rehearsal builds without a tag only: a rehearsal (self-signed stand-in) never goes to a release"
              exit 1
            fi
            signing=rehearsal
          elif [ -z "$missing" ] && [ -n "$TAG" ]; then
            # SignPath reads the origin (repository, ref, commit) from this workflow run, not from what is checked out.
            if [ "$RUN_REF" != "refs/tags/$TAG" ]; then
              echo "::error::SignPath signs builds of the tag itself: push the tag, or Run workflow with \"Use workflow from\" set to the tag $TAG (this run is on $RUN_REF)"
              exit 1
            fi
            signing=signpath
          else
            signing=classic
            if [ -z "$missing" ]; then
              echo "::notice title=Windows: not signed by SignPath::SignPath signs release builds of a tag; this run builds without one."
            elif [ "$missing" != " secret SIGNPATH_API_TOKEN variable SIGNPATH_ORGANIZATION_ID variable SIGNPATH_PROJECT_SLUG variable SIGNPATH_SIGNING_POLICY_SLUG" ]; then
              echo "::warning title=SignPath is only partly configured::missing:$missing (Windows packages are built as without SignPath)"
            fi
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "Windows signing: $signing" >> "$GITHUB_STEP_SUMMARY"
      - name: Can CI sign and notarize macOS packages?
        id: mac
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REHEARSAL: ${{ inputs.signpath_rehearsal == true }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          notary=no
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then notary=yes; fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then notary=yes; fi
          if [ "$REHEARSAL" = true ]; then
            # A rehearsal of the Windows signing flow builds no macOS packages.
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$MAC_CSC_LINK" ] && [ "$notary" = yes ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            command="node scripts/release-mac.mjs ${TAG:-<tag>}"
            echo "::notice title=macOS packages are built locally::$command"
            {
              echo "### macOS packages are built locally"
              echo
              echo "No Developer ID signing and notarization secrets are configured, so this run builds no macOS packages (unsigned macOS packages never go to a release)."
              echo
              echo "On the release Mac: \`$command\` (docs/RELEASING.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  macos:
    name: macOS (arm64 + x64, Developer ID)
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          node scripts/gen-icons.mjs --verify
          node scripts/licenses.mjs --check
          node scripts/gen-golden.mjs --check
          pnpm typecheck
          pnpm test
          swift test --package-path native/macos
      - name: Native helper (arm64, x64)
        run: node scripts/build-native.mjs mac --arch all
      - name: Build bundles
        run: pnpm build
      # The identity goes into a temporary keychain on the search list, so that electron-builder
      # (CSC_NAME) and the DMG signing after it (scripts/mac-dmg.mjs) both find it.
      - name: Import the Developer ID certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orbitdrop-signing.keychain-db"
          cert="$RUNNER_TEMP/developer-id.p12"
          password="$(openssl rand -base64 32)"
          case "$MAC_CSC_LINK" in
            https://*) curl -fsSL "$MAC_CSC_LINK" -o "$cert" ;;
            *) printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$cert" ;;
          esac
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MAC_CSC_LINK holds no Developer ID Application identity"
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "ORBITDROP_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # notarytool needs the App Store Connect API key as a file.
      - name: Prepare the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 is not set: notarization uses the Apple ID secrets"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" > "$key")
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Package (signed, notarized, stapled) and smoke-test
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package.mjs mac --arch all --skip-build --skip-native --require-signing --require-notarization
      - name: Remove the signing keychain and the key file
        if: always()
        run: |
          if [ -n "${ORBITDROP_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$ORBITDROP_SIGNING_KEYCHAIN" || true; fi
          if [ -n "${APPLE_API_KEY:-}" ]; then rm -f "$APPLE_API_KEY"; fi
      - name: Keep the packages (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrbitDrop-macos-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/build-report-*.json

  windows:
    name: Windows (x64)
    needs: plan
    runs-on: windows-latest
    # SignPath: each of the two signing requests waits for a person to approve it (up to 90 minutes each).
    timeout-minutes: 240
    permissions:
      contents: read
      # SignPath's GitHub connector reads this job and downloads the artifacts it signs (github-token).
      actions: read
    # pwsh only fails a multi-line step on its last command; bash -e fails on any of them.
    defaults:
      run:
        shell: bash
    env:
      # Labels a rehearsal of the SignPath flow (self-signed stand-in): "-rehearsal" artifacts, never released.
      ORBITDROP_SIGNPATH_REHEARSAL: ${{ needs.plan.outputs.win_signing == 'rehearsal' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: pnpm/action-setup@v6
      # No dependency cache: a release (and anything SignPath signs) is built from the lockfile alone.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          node scripts/gen-icons.mjs --verify
          node scripts/licenses.mjs --check
          node scripts/gen-golden.mjs --check
          node scripts/set-version.mjs --check
          pnpm typecheck
          pnpm test
      - name: Native helper (x64)
        run: node scripts/build-native.mjs win --arch x64
      - name: Build bundles
        run: pnpm build

      # ── Without SignPath (as before): Authenticode-signed when WIN_CSC_LINK exists, otherwise unsigned and
      #    labelled "-unsigned".
      - name: Package (signed if a certificate exists), smoke-test, install/uninstall test
        if: needs.plan.outputs.win_signing == 'classic'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/package.mjs win --arch x64 --skip-build --skip-native --install-test

      # ── SignPath Foundation (docs/packaging.md §5): OrbitDrop.exe, OrbitDropHelper.exe and the uninstaller are
      #    signed first (request 1), then the installer that contains them (request 2). Each request needs an
      #    approver's manual approval in SignPath. scripts/package.mjs checks every returned file against the file
      #    it sent (same bytes plus a signature) and every check runs again on the signed package.
      - name: "SignPath 1/2: build, check and stage OrbitDrop.exe, OrbitDropHelper.exe and the uninstaller"
        if: needs.plan.outputs.win_signing != 'classic'
        run: node scripts/package.mjs win --arch x64 --skip-build --skip-native --signpath prepare
      - name: "SignPath 1/2: upload the executables to sign (workflow artifact)"
        id: request-1
        if: needs.plan.outputs.win_signing != 'classic'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-request-1-executables
          path: apps/desktop/release/signpath/request-1/
          if-no-files-found: error
          retention-days: 7
      - name: "SignPath 1/2: signing request (artifact configuration windows-binaries; waits for approval)"
        if: needs.plan.outputs.win_signing == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.request-1.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.plan.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: apps/desktop/release/signpath/signed-1
      - name: "SignPath 1/2 rehearsal: self-signed stand-in instead of SignPath"
        if: needs.plan.outputs.win_signing == 'rehearsal'
        shell: pwsh
        run: ./scripts/signpath-rehearsal.ps1 -Request apps/desktop/release/signpath/request-1 -Output apps/desktop/release/signpath/signed-1
      - name: "SignPath 2/2: installer from the signed executables, staged for signing"
        if: needs.plan.outputs.win_signing != 'classic'
        run: node scripts/package.mjs win --arch x64 --skip-build --skip-native --signpath installer --signed apps/desktop/release/signpath/signed-1
      - name: "SignPath 2/2: upload the installer to sign (workflow artifact)"
        id: request-2
        if: needs.plan.outputs.win_signing != 'classic'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-request-2-installer
          path: apps/desktop/release/signpath/request-2/
          if-no-files-found: error
          retention-days: 7
      - name: "SignPath 2/2: signing request (artifact configuration windows-installer; waits for approval)"
        if: needs.plan.outputs.win_signing == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.request-2.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.plan.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: apps/desktop/release/signpath/signed-2
      - name: "SignPath 2/2 rehearsal: self-signed stand-in instead of SignPath"
        if: needs.plan.outputs.win_signing == 'rehearsal'
        shell: pwsh
        run: ./scripts/signpath-rehearsal.ps1 -Request apps/desktop/release/signpath/request-2 -Output apps/desktop/release/signpath/signed-2
      - name: "SignPath: signed installer, latest.yml, every check, smoke test, install/uninstall test"
        if: needs.plan.outputs.win_signing != 'classic'
        run: node scripts/package.mjs win --arch x64 --skip-build --skip-native --signpath finish --signed apps/desktop/release/signpath/signed-2 --install-test

      - name: Keep the packages (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrbitDrop-windows-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/build-report-*.json

  release:
    name: Draft release
    needs: [plan, macos, windows]
    # Forks build but never draft: installed copies only read keilvher1/orbitdrop (app-update.yml).
    if: >-
      always() && github.repository == 'keilvher1/orbitdrop' && needs.plan.result == 'success' && needs.plan.outputs.tag != '' &&
      needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Only the scripts' YAML reader is needed: no Electron runtime.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Download this run's packages
        uses: actions/download-artifact@v7
        with:
          pattern: OrbitDrop-*
          path: ${{ runner.temp }}/packages
      # LGPL/MPL corresponding sources for exactly the versions this release ships (docs/packaging.md).
      # Packages of the other OSes are fetched from npm and checked against pnpm-lock.yaml.
      - name: LGPL/MPL corresponding sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/third-party-sources.mjs --out "${{ runner.temp }}/packages/OrbitDrop-third-party-sources"
      - name: Create or update the draft release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PACKAGES: ${{ runner.temp }}/packages
        run: node scripts/release-assets.mjs "$TAG" "$PACKAGES"
