# OrbitDrop — electron-builder 26 configuration.
# Every choice is explained in docs/packaging.md. Use `node scripts/package.mjs mac|win`
# (or `pnpm package:mac` / `pnpm package:win`) rather than calling electron-builder directly:
# the script builds the native helper and bundles first, decides between real signing and an
# explicitly labelled unsigned/ad-hoc build, and runs the packaged app's --smoke-test.

# Product id, fixed before the first public release (2026-11-12). It must equal the id in
# apps/desktop/src/main/index.ts (Windows AppUserModelID; scripts/package.mjs fails the build when
# the two differ). Never change it again: on Windows it seeds the NSIS uninstall key GUID, on macOS
# it keys privacy permissions, login items and updates, so a change breaks in-place upgrades.
# See docs/packaging.md "제품 ID".
appId: io.github.keilvher1.orbitdrop
productName: OrbitDrop
copyright: Copyright © 2026 OrbitDrop contributors

directories:
  buildResources: build
  output: release

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Automatic updates (electron-updater, apps/desktop/src/main/update/): this GitHub provider is
# written into every package as Resources/app-update.yml and makes electron-builder generate the
# update metadata next to the artifacts (latest-mac.yml for the macOS zips, latest.yml for the NSIS
# installer; the DMGs are not update files, see dmg.writeUpdateInfo). A build never uploads
# anything itself: scripts/package.mjs always passes `--publish never`, and releases are drafted by
# .github/workflows/release.yml and scripts/release-mac.mjs, then published by a human
# (docs/RELEASING.md).
publish:
  provider: github
  owner: keilvher1
  repo: orbitdrop

# All native dependencies (sharp/@img, @napi-rs/canvas) ship N-API prebuilt binaries that are
# ABI-stable across Node and Electron, so nothing is recompiled.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

asar: true
# Native code cannot read from inside app.asar, so the native packages live in app.asar.unpacked.
# (Electron redirects require() of .node files there; libvips is found through sharp's rpath.)
# Pure-JS packages and data files (pdf.js fonts/cmaps/wasm) stay packed: Electron's fs, also in
# utilityProcess workers, reads them from the archive (measured, see docs/packaging.md).
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/@napi-rs/canvas-*/**"

files:
  - out/**
  - package.json
  - "!**/*.map"
  # documentation/sources/typings inside dependencies (LICENSE files are kept)
  - "!**/node_modules/**/{README,readme,Readme,CHANGELOG,changelog,HISTORY,History}{,.md,.markdown,.txt}"
  - "!**/node_modules/**/*.{d.mts,d.cts}"
  - "!**/node_modules/sharp/{src,install}/**"
  - "!**/node_modules/@img/sharp-libvips-*/lib/glib-2.0/include/**"
  # pdf.js: @orbitdrop/processors loads only legacy/build/pdf.mjs + pdf.worker.mjs (plus cmaps,
  # standard_fonts, wasm, iccs). The modern build, minified copies, viewer, typings and the
  # scripting sandbox (QuickJS; OrbitDrop never runs JavaScript embedded in PDFs) are dropped.
  - "!**/node_modules/pdfjs-dist/{build,web,types,image_decoders}/**"
  - "!**/node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!**/node_modules/pdfjs-dist/legacy/build/{*.min.mjs,pdf.sandbox*}"
  - "!**/node_modules/pdfjs-dist/wasm/quickjs-eval.*"
  - "!**/node_modules/pdf-lib/{dist,src,ts3.4}/**"
  - "!**/node_modules/docx/dist/*.{iife.js,umd.cjs}"
  - "!**/node_modules/zod/src/**"
  # Browser/ESM duplicates of pure-JS dependencies. Node loads each package's "exports"/"main"
  # (CommonJS: docx dist/index.cjs, pdf-lib cjs/, standard-fonts lib/, upng cjs/, pako lib/,
  # jszip lib/, xml-js lib/), never these. docx's other entry points (docx/layout, docx/shapes, …)
  # are not imported; dist/index.mjs stays for a future ESM import("docx"). The packaged
  # native-module check writes a real PDF (pdf-lib) and DOCX (docx) from the trimmed package.
  - "!**/node_modules/docx/dist/{layout,shapes,html,charts,math,watermarks}.*"
  - "!**/node_modules/pdf-lib/es/**"
  - "!**/node_modules/@pdf-lib/standard-fonts/{dist,es}/**"
  - "!**/node_modules/@pdf-lib/upng/dist/**"
  - "!**/node_modules/{pako,jszip}/dist/**"
  - "!**/node_modules/xml-js/{dist,bin,types}/**"
  - "!**/node_modules/{nanoid,semver}/bin/**"
  # Tooling and project documents inside dependencies (licence files are kept).
  - "!**/node_modules/**/{.eslintrc*,.editorconfig,.codeclimate.yml,tsconfig.json,CHANGES.md,CONTRIBUTING.md,GOVERNANCE.md,SECURITY.md,CODE_OF_CONDUCT.md,sponsors.md}"
  - "!**/node_modules/readable-stream/doc/**"
  - "!**/node_modules/tslib/*.html"
  - "!**/node_modules/@types/**"
  - "!**/node_modules/undici-types/**"
  # Keep only the prebuilt native packages of the target: ${platform} is the build host's
  # process.platform, which is the target OS because packages are always built natively
  # (scripts/package.mjs refuses cross builds). Platform-level "files" lists are avoided on
  # purpose: an exclusion-only platform list replaces this include list in electron-builder 26.
  - "!**/node_modules/@img/sharp-!(${platform}-${arch}|libvips-${platform}-${arch}){,/**}"
  - "!**/node_modules/@napi-rs/canvas-!(${platform}-${arch}|${platform}-${arch}-msvc){,/**}"

extraResources:
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
  # Tray / menu-bar icons: main looks in <resources>/tray first (apps/desktop/src/main/app.ts);
  # each OS gets only the files apps/desktop/src/main/tray/controller.ts loads (mac/win below).

# Keep Chromium's own UI strings for the app's two languages only (Korean default, English).
electronLanguages:
  - ko
  - en-US

# Harden the shipped Electron binary. RunAsNode/NODE_OPTIONS/--inspect are disabled so other
# processes cannot reuse OrbitDrop's binary (and any permission the user granted it) as a
# generic Node runtime; the app only loads its own integrity-checked app.asar.
# scripts/package.mjs reads the fuses back from every package and fails on any difference.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Must stay ENABLED while the windows load the UI with loadFile() from file:// inside app.asar
  # (apps/desktop/src/main/windows/manager.ts). With this fuse disabled, Electron's file://
  # handler stops reading app.asar (every window fails with ERR_FILE_NOT_FOUND — measured on the
  # 0.1.0 packages, which shipped blank windows) and outside an asar the module script and CSS
  # are blocked by CORS. Disable it only after the UI is served from a custom protocol.
  grantFileProtocolExtraPrivileges: true
  # macOS: re-apply an ad-hoc signature after flipping fuses so builds that skip signing
  # (e.g. pull-request CI) still launch on Apple Silicon. Real signing replaces it.
  resetAdHocDarwinSignature: true

# Makes electron-builder's pnpm collector copy the exact dependency versions from the hoisted
# node_modules tree (it shipped wrong versions of tslib and nanoid before; details in the file).
beforePack: ./build/before-pack.cjs
# Verifies the native helper and the native binaries of the target os/arch, the dependency tree
# inside app.asar, prunes foreign architectures and fails the build with a clear message when
# something is missing.
afterPack: ./build/after-pack.cjs # shim → scripts/after-pack.cjs

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities
  minimumSystemVersion: "14.0"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # Developer ID signing uses these (JIT only). Unsigned local builds are ad-hoc signed by
  # scripts/package.mjs with build/entitlements.mac.adhoc.plist instead.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Same as the default signing, except the native drag helper (Resources/helper/) is signed with
  # the hardened runtime and NO entitlements (build/entitlements.helper.plist is empty) instead of
  # the inherited Electron entitlements; with a Developer ID it also gets a secure timestamp.
  sign: ./build/sign.cjs
  extendInfo:
    # Menu-bar app: no Dock icon, no main window at launch (main also calls app.dock.hide()).
    LSUIElement: true
    # Electron's template Info.plist asks for camera, microphone, Bluetooth and audio capture.
    # OrbitDrop uses none of them: every permission request is denied (src/main/security.ts) and
    # the hardened runtime has no device entitlements. null removes the key (electron-builder 26).
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSAudioCaptureUsageDescription: null
  extraResources:
    # Staged by scripts/build-native-mac.mjs. ${arch} is arm64 or x64. Only the helper itself is
    # shipped (no dSYM or other build by-products).
    - from: resources/helper/darwin-${arch}
      to: helper
      filter: ["OrbitDropHelper", "OrbitDropHelper.app/**"]
    # Menu-bar template icon (Retina variant picked up automatically).
    - from: resources/tray
      to: tray
      filter: ["trayTemplate.png", "trayTemplate@2x.png"]
    # electron-builder's macOS output omits Electron's licence files (they sit next to
    # Electron.app in the upstream zip); ship them inside the bundle. On Windows they are
    # already copied next to OrbitDrop.exe.
    - from: ../../node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: ../../node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html

dmg:
  title: ${productName} ${version}
  # Updates use the zip (Squirrel.Mac); the DMG is for first installs only. Keeping it out of
  # latest-mac.yml also keeps that file valid after scripts/package.mjs signs, notarizes and
  # staples the DMG (stapling changes its bytes). DMG signing is done there too (dmg.sign stays
  # off: electron-builder would sign without a secure timestamp).
  writeUpdateInfo: false
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  # Called for every file electron-builder signs (OrbitDrop.exe, the helper, the uninstaller, the
  # installer): sets OrbitDrop.exe's ProductVersion string to the release version (electron-builder
  # writes x.y.z.0; every signed file must say the same version), keeps a copy of the uninstaller for
  # the version check and the SignPath flow, and signs with signtool only when a certificate is
  # configured. Unsigned builds stay unsigned. Details: scripts/win-sign.cjs, docs/packaging.md §5.
  signtoolOptions:
    sign: ./build/win-sign.cjs
  extraResources:
    # Staged by scripts/build-native-win.mjs: the helper plus any app-local runtime DLLs.
    - from: resources/helper/win32-${arch}
      to: helper
      filter: ["OrbitDropHelper.exe", "*.dll"]
    # Notification-area icon (tray.png is the fallback the tray controller tries second).
    - from: resources/tray
      to: tray
      filter: ["tray.ico", "tray.png", "tray@2x.png"]

nsis:
  # Assisted, per-user installer: no administrator rights, installation folder can be changed,
  # uninstaller registered under HKCU. build/installer.nsh forces the per-user mode.
  oneClick: false
  perMachine: false
  allowElevation: false
  # elevate.exe is only needed for per-machine installs: electron-updater runs the per-user
  # installer without elevation (latest.yml has no isAdminRightsRequired).
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OrbitDrop
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # No blockmap for the installer: Windows updates download the whole installer (simpler, and no
  # request for the old version's blockmap — which would name the installed version — is made).
  differentialPackage: false
  installerLanguages:
    - ko_KR
    - en_US
  language: "1042"
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
